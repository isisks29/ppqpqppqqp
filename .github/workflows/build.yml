name: Build injectable dylib

on:
  push:
    branches: [main]
    paths:
      - 'inject_test.c'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup osxcross
        run: |
          # 1. 安装 osxcross 依赖
          sudo apt-get update
          sudo apt-get install -y clang gcc g++ make cmake libssl-dev libxml2-dev zlib1g-dev xz-utils

          # 2. 克隆 osxcross 仓库
          git clone https://github.com/tpoechtrager/osxcross.git $GITHUB_WORKSPACE/osxcross

          # 3. 下载 SDK (osxcross 需要一个 SDK 来编译)
          # 我们使用一个较小的 SDK 版本，避免下载整个 xybp888 仓库
          git clone --depth 1 --branch 11.3 https://github.com/phracker/MacOSX-SDKs.git $GITHUB_WORKSPACE/MacOSX-SDKs
          mv $GITHUB_WORKSPACE/MacOSX-SDKs/MacOSX11.3.sdk $GITHUB_WORKSPACE/osxcross/SDK/
          
          # 4. 编译 osxcross 工具链
          cd $GITHUB_WORKSPACE/osxcross
          UNATTENDED=yes ./build.sh

      - name: Compile Dylib
        run: |
          # 5. 将 osxcross 的 bin 目录添加到 PATH
          export PATH=$GITHUB_WORKSPACE/osxcross/target/bin:$PATH

          # 6. 使用 osxcross 提供的 clang 进行编译
          # -target arm64-apple-ios 指定了目标平台和架构
          # -isysroot 指向 osxcross 自带的 SDK
          o64-clang -target arm64-apple-ios \
            -isysroot $GITHUB_WORKSPACE/osxcross/SDK/MacOSX11.3.sdk \
            -mios-version-min=13.0 \
            -dynamiclib \
            -fobjc-arc \
            -o inject_test.dylib \
            inject_test.c

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inject_test_dylib
          path: inject_test.dylib
