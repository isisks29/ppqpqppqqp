name: Build injectable dylib

on:
  push:
    branches: [main]
    paths:
      - 'inject_test.c'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Environment & SDK
        run: |
          # 1. 安装 clang-15 (比默认的 clang-18 兼容性更好，且支持 ubuntu-24.04)
          sudo apt-get update
          sudo apt-get install -y clang-15 libxml2-dev
          
          # 2. 下载 SDK
          echo "Downloading iOS SDK..."
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git $GITHUB_WORKSPACE/ios-sdk
          
          # 3. 自动寻找 SDK 路径 (解决目录结构变动问题)
          # 逻辑：先找 iPhoneOS.sdk，找不到就找 iPhoneOS*.sdk
          SDK_PATH=$(find $GITHUB_WORKSPACE/ios-sdk -maxdepth 3 -type d -name "iPhoneOS.sdk" | head -n 1)
          if [ -z "$SDK_PATH" ]; then
             SDK_PATH=$(find $GITHUB_WORKSPACE/ios-sdk -maxdepth 3 -type d -name "iPhoneOS*.sdk" | sort | tail -n 1)
          fi
          
          echo "Found SDK at: $SDK_PATH"
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV

      - name: Compile Dylib
        run: |
          # 使用找到的 SDK 路径进行编译
          # -target arm64-apple-ios14.0: 指定目标架构和最低版本
          # -fobjc-arc: 开启自动引用计数
          clang-15 -arch arm64 -isysroot ${{ env.SDK_PATH }} \
            -mios-version-min=14.0 \
            -fobjc-arc \
            -shared -o inject.dylib inject_test.c
            
          echo "Build finished! Checking file type:"
          file inject.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: injectable-dylib
          path: inject.dylib
