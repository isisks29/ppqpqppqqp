name: Build injectable dylib

on:
  push:
    branches: [main]
    paths:
      - 'inject_test.c'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Environment & SDK
        run: |
          # 1. 安装基础编译工具和 ldid (用于签名)
          sudo apt-get update
          sudo apt-get install -y clang ldid git
          
          # 2. 下载 SDK (使用 xybp888 的仓库)
          echo "Downloading iOS SDK..."
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git $GITHUB_WORKSPACE/ios-sdk
          
          # 3. 自动寻找 SDK 路径
          SDK_PATH=$(find $GITHUB_WORKSPACE/ios-sdk -maxdepth 3 -type d -name '*iPhoneOS*' | head -n 1)
          echo "Found SDK at: $SDK_PATH"
          
          # 将路径保存为环境变量供下一步使用
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV

      - name: Compile Dylib
        run: |
          # 使用系统自带的 clang 进行交叉编译
          # 注意：这里必须指定 -target arm64-apple-ios
          clang -arch arm64 \
                -isysroot $SDK_PATH \
                -mios-version-min=13.0 \
                -dynamiclib \
                -fobjc-arc \
                -o inject_test.dylib \
                inject_test.c
          
          echo "Compilation finished."

      - name: Sign Dylib (Optional but recommended)
        run: |
          # 使用 ldid 进行伪签名，确保在越狱设备上能加载
          ldid -S inject_test.dylib
          echo "Signing finished."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inject_test_dylib
          path: inject_test.dylib
