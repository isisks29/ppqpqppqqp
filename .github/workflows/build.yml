name: Build injectable dylib

on:
  push:
    branches: [main]
    paths:
      - 'inject_test.c'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils

      - name: Download iOS SDK
        run: |
          # 下载 iPhoneOS SDK
          git clone --depth 1 --branch 15.0 https://github.com/xybp888/iOS-SDKs.git /tmp/iOS-SDKs
          # 找到 SDK 路径
          SDK_PATH=$(find /tmp/iOS-SDKs -maxdepth 1 -name "iPhoneOS*.sdk" -type d | head -1)
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV
          echo "Found SDK: $SDK_PATH"

      - name: Compile Dylib
        run: |
          clang -target arm64-apple-ios15.0 \
            -isysroot $SDK_PATH \
            -dynamiclib \
            -fobjc-arc \
            -fuse-ld=lld \
            -o inject_test.dylib \
            inject_test.c

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inject_test_dylib
          path: inject_test.dylib
