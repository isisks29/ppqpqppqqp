name: Build injectable dylib

on:
  push:
    branches: [main]
    paths:
      - 'inject_test.c'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Environment & SDK
        run: |
          # 1. 下载并安装官方完整版 LLVM (支持 ARM64 交叉编译)
          echo "Installing official LLVM..."
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-15.0.7/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xf clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          export PATH=$GITHUB_WORKSPACE/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-18.04/bin:$PATH
          
          # 2. 下载 SDK
          echo "Downloading iOS SDK..."
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git $GITHUB_WORKSPACE/ios-sdk
          
          # 3. 自动寻找 SDK 路径
          SDK_PATH=$(find $GITHUB_WORKSPACE/ios-sdk -maxdepth 3 -type d -name '*iPhoneOS*' | head -n 1)
          echo "Using SDK at: $SDK_PATH"
          
          # 4. 验证编译器是否识别 ARM64
          clang -arch arm64 -dM -E - < /dev/null | grep __arm64__ || (echo "Error: Compiler does not support ARM64"; exit 1)

      - name: Compile Dylib
        run: |
          # 重新设置环境变量 (GitHub Actions 的每个 run 块环境是隔离的)
          export PATH=$GITHUB_WORKSPACE/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-18.04/bin:$PATH
          SDK_PATH=$(find $GITHUB_WORKSPACE/ios-sdk -maxdepth 3 -type d -name '*iPhoneOS*' | head -n 1)
          
          # 执行编译
          clang -arch arm64 \
            -isysroot $SDK_PATH \
            -mios-version-min=13.0 \
            -dynamiclib \
            -fobjc-arc \
            -o inject_test.dylib \
            inject_test.c
            
          echo "Build successful!"
          ls -lh inject_test.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: injectable-dylib
          path: inject_test.dylib
