name: Build injectable dylib

on:
  push:
    branches: [main]
    paths:
      - 'inject_test.c'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup osxcross
        run: |
          # 1. 安装 osxcross 依赖
          sudo apt-get update
          sudo apt-get install -y clang gcc g++ make cmake libssl-dev libxml2-dev zlib1g-dev xz-utils

          # 2. 克隆 osxcross 仓库
          git clone https://github.com/tpoechtrager/osxcross.git $GITHUB_WORKSPACE/osxcross

          # 3. 下载 SDK
          git clone --depth 1 --branch 11.3 https://github.com/phracker/MacOSX-SDKs.git $GITHUB_WORKSPACE/MacOSX-SDKs

          # 4. 将 SDK 打包成真正的 .tar.xz 压缩文件
          mkdir -p $GITHUB_WORKSPACE/osxcross/tarballs
          tar -C $GITHUB_WORKSPACE/MacOSX-SDKs -cJf $GITHUB_WORKSPACE/osxcross/tarballs/MacOSX11.3.sdk.tar.xz MacOSX11.3.sdk

          # 5. 编译 osxcross 工具链
          cd $GITHUB_WORKSPACE/osxcross
          UNATTENDED=1 ./build.sh

      - name: Compile Dylib
        run: |
          # 6. 将 osxcross 的 bin 目录添加到 PATH
          export PATH=$GITHUB_WORKSPACE/osxcross/target/bin:$PATH

          # 7. 使用 osxcross 提供的 clang 进行编译
          o64-clang -target arm64-apple-ios \
            -mios-version-min=13.0 \
            -dynamiclib \
            -fobjc-arc \
            -o inject_test.dylib \
            inject_test.c

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inject_test_dylib
          path: inject_test.dylib
