name: Build injectable dylib

on:
  push:
    branches: [main]
    paths:
      - 'inject_test.c'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile iOS Dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -x objective-c \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -dynamiclib \
            -fobjc-arc \
            -framework UIKit \
            -o inject_test.dylib \
            inject_test.c

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inject_test_dylib
          path: inject_test.dylib
